<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shrimp Terminal</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="web.css">
</head>

<body>
    <div class="terminal-container">
        <div class="terminal-header">
            <div class="brand-container">
                <img src="logo.png" class="logo">
                <span>SHRIMP</span>
            </div>
            <div id="utc-time">UTC: --:--:--</div>
        </div>

        <table class="terminal-table">
            <thead>
                <tr>
                    <th>Asset</th>
                    <th>Last Price</th>
                    <th>Prediction</th>
                    <th>24h Change</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr id="row-BTC">
                    <td class="coin-name"><span>BTC</span></td>
                    <td class="price">--</td>
                    <td class="pred">--</td>
                    <td class="change">--</td>
                </tr>
                <tr id="row-ETH">
                    <td class="coin-name"><span>ETH</span></td>
                    <td class="price">--</td>
                    <td class="pred">--</td>
                    <td class="change">--</td>
                </tr>
                <tr id="row-SOL">
                    <td class="coin-name"><span>SOL</span></td>
                    <td class="price">--</td>
                    <td class="pred">--</td>
                    <td class="change">--</td>
                </tr>
                <tr id="row-BNB">
                    <td class="coin-name"><span>BNB</span></td>
                    <td class="price">--</td>
                    <td class="pred">--</td>
                    <td class="change">--</td>
                </tr>
                <tr id="row-DOGE">
                    <td class="coin-name"><span>DOGE</span></td>
                    <td class="price">--</td>
                    <td class="pred">--</td>
                    <td class="change">--</td>
                </tr>
                <tr id="row-SHIB">
                    <td class="coin-name"><span>SHIB</span></td>
                    <td class="price">--</td>
                    <td class="pred">--</td>
                    <td class="change">--</td>
                </tr>
                <tr id="row-AVAX">
                    <td class="coin-name"><span>AVAX</span></td>
                    <td class="price">--</td>
                    <td class="pred">--</td>
                    <td class="change">--</td>
                </tr>
                <tr id="row-LINK">
                    <td class="coin-name"><span>LINK</span></td>
                    <td class="price">--</td>
                    <td class="pred">--</td>
                    <td class="change">--</td>
                </tr>
                <tr id="row-ADA">
                    <td class="coin-name"><span>ADA</span></td>
                    <td class="price">--</td>
                    <td class="pred">--</td>
                    <td class="change">--</td>
                </tr>
            </tbody>
        </table>

        <div class="terminal-footer">
            <div id="cycle-info">- Initializing...</div>
            <div class="status-meta">
                <span class="status-item"><span class="modem-light"></span>WS_ACTIVE</span>
                <span class="status-item"><span class="modem-light secure"></span>SSL_SECURE</span>
                <span id="bit-stream" class="bit-stream"></span>
            </div>
        </div>
        <div class="loading-bar-container">
            <div id="progress" class="loading-bar"></div>
        </div>
    </div>

    <script>
        const coins = ['BTC', 'ETH', 'SOL', 'BNB', 'DOGE', 'SHIB', 'AVAX', 'LINK', 'ADA'];
        const prevData = {
            BTC: { price: 0, change: 0 },
            ETH: { price: 0, change: 0 },
            SOL: { price: 0, change: 0 },
            BNB: { price: 0, change: 0 },
            DOGE: { price: 0, change: 0 },
            SHIB: { price: 0, change: 0 },
            AVAX: { price: 0, change: 0 },
            LINK: { price: 0, change: 0 },
            ADA: { price: 0, change: 0 }
        };
        let lastUpdateTime = Date.now();

        function updateClock() {
            const now = new Date();
            document.getElementById('utc-time').innerText = `UTC: ${now.toISOString().substr(11, 8)}`;
            const elapsed = Date.now() - lastUpdateTime;
            const remaining = Math.max(0, (5000 - elapsed) / 1000).toFixed(1);
            const frames = ['-', '\\', '|', '/'];
            document.getElementById('cycle-info').innerText = `${frames[Math.floor(Date.now() / 150) % 4]} Next sync in: ${remaining}s`;
            const stream = Math.random().toString(16).toUpperCase().substr(2, 8);
            document.getElementById('bit-stream').innerText = `[${stream}]`;
            document.getElementById('progress').style.width = `${Math.min((elapsed / 5000) * 100, 100)}%`;
        }

        async function fetchCoin(coin) {
            try {
                const r = await fetch(`/api/predict?coin=${coin}`);
                return await r.json();
            } catch (e) { return { success: false }; }
        }

        function createAnimatedValue(newValue, oldValue, formatFunc) {
            if (newValue === oldValue || oldValue === 0) return formatFunc(newValue);
            const isUp = newValue > oldValue;
            const dir = isUp ? 'slide-down' : 'slide-up';
            return `<span class="animate-container">
                <span class="${dir}-out">${formatFunc(oldValue)}</span>
                <span class="${dir}-in">${formatFunc(newValue)}</span>
            </span>`;
        }

        async function update() {
            for (const coin of coins) {
                const data = await fetchCoin(coin);
                const row = document.getElementById(`row-${coin}`);
                if (!row) continue;

                if (data.success) {
                    const priceCell = row.querySelector('.price');
                    const predCell = row.querySelector('.pred');
                    const changeCell = row.querySelector('.change');

                    if (data.price !== prevData[coin].price && prevData[coin].price !== 0) {
                        const flashClass = data.price > prevData[coin].price ? 'flash-up' : 'flash-down';
                        row.classList.remove('flash-up', 'flash-down');
                        void row.offsetWidth;
                        row.classList.add(flashClass);
                    }

                    priceCell.innerHTML = createAnimatedValue(data.price, prevData[coin].price, (v) => `$ ${v.toLocaleString('en-US', { minimumFractionDigits: 2 })}`);

                    predCell.innerText = data.trend;
                    predCell.className = `pred ${data.trend === 'UP' ? 'pred-up' : 'pred-down'}`;

                    changeCell.innerHTML = createAnimatedValue(data.change, prevData[coin].change, (v) => (v >= 0 ? '+' : '') + v.toFixed(2) + '%');
                    changeCell.className = `change change-val ${data.change >= 0 ? 'pred-up' : 'pred-down'}`;

                    prevData[coin] = { price: data.price, change: data.change };
                } else {
                    row.innerHTML = `<td class="coin-name"><span>${coin}</span></td><td colspan="3" style="color:var(--text-dim)">Node offline</td>`;
                }
            }
            lastUpdateTime = Date.now();
        }

        setInterval(updateClock, 100);
        update();
        setInterval(update, 5000);
    </script>
</body>

</html>
