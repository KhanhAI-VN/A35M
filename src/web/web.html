<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A35M Advanced Dashboard</title>
    <link rel="stylesheet" href="web.css">
</head>
<body>
    <div class="terminal-container">
        <div class="terminal-header">
            <div><span class="status-dot"></span>System: A35M_v4.2 // Active</div>
            <div id="utc-time">UTC: --:--:--</div>
        </div>
        
        <table class="terminal-table">
            <thead>
                <tr>
                    <th>Asset</th>
                    <th>Last Price</th>
                    <th>Prediction</th>
                    <th>24h Change</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Data injected here -->
            </tbody>
        </table>
        
        <div class="terminal-footer">
            <div id="cycle-info">- Initializing...</div>
            <div>WS_ACTIVE // SSL_SECURE</div>
        </div>
        <div class="loading-bar-container">
            <div id="progress" class="loading-bar"></div>
        </div>
    </div>

    <script>
        const coins = ['BTC', 'ETH'];
        let lastUpdateTime = Date.now();

        function updateClock() {
            const now = new Date();
            document.getElementById('utc-time').innerText = `UTC: ${now.toISOString().substr(11, 8)}`;
            
            const elapsed = Date.now() - lastUpdateTime;
            const remaining = Math.max(0, (5000 - elapsed) / 1000).toFixed(1);
            
            const frames = ['-', '\\', '|', '/'];
            const spinner = frames[Math.floor(Date.now() / 150) % 4];
            
            document.getElementById('cycle-info').innerText = `${spinner} Next sync in: ${remaining}s`;
            
            const progress = Math.min((elapsed / 5000) * 100, 100);
            document.getElementById('progress').style.width = `${progress}%`;
        }

        async function fetchCoin(coin) {
            try {
                const r = await fetch(`/api/predict?coin=${coin}`);
                return await r.json();
            } catch (e) { return { success: false }; }
        }

        async function update() {
            const tbody = document.getElementById('table-body');
            let rowsHtml = '';

            for (const coin of coins) {
                const data = await fetchCoin(coin);
                if (data.success) {
                    const price = data.price.toLocaleString('en-US', { minimumFractionDigits: 2 });
                    const trendClass = data.trend === 'UP' ? 'pred-up' : 'pred-down';
                    const change = (data.change >= 0 ? '+' : '') + data.change.toFixed(2) + '%';
                    
                    rowsHtml += `
                        <tr>
                            <td class="coin-name">${coin}</td>
                            <td class="price-val">$ ${price}</td>
                            <td class="${trendClass}">${data.trend}</td>
                            <td class="change-val ${data.change >= 0 ? 'pred-up' : 'pred-down'}">${change}</td>
                        </tr>
                    `;
                } else {
                    rowsHtml += `<tr><td class="coin-name">${coin}</td><td colspan="3" style="color:var(--text-dim)">Node offline</td></tr>`;
                }
            }
            
            tbody.innerHTML = rowsHtml;
            lastUpdateTime = Date.now();
        }

        setInterval(updateClock, 100);
        update();
        setInterval(update, 5000);
    </script>
</body>
</html>
