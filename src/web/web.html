<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A35M Advanced Dashboard</title>
    <link rel="stylesheet" href="web.css">
</head>
<body>
    <div class="terminal-container">
        <div class="terminal-header">
            <div><span class="status-dot"></span>System: A35M_ENGINE_v4.2</div>
            <div id="utc-time">UTC: --:--:--</div>
        </div>
        
        <pre id="dashboard">Initializing neural uplink...</pre>
        
        <div class="terminal-footer" id="cycle-info">
            - Next update in: 5.0s | Source: Binance API | WebSocket: Active
        </div>
        <div id="progress" class="loading-bar"></div>
    </div>

    <script>
        const coins = ['BTC', 'ETH'];
        let lastUpdateTime = Date.now();

        function updateClock() {
            const now = new Date();
            document.getElementById('utc-time').innerText = `UTC: ${now.toISOString().substr(11, 8)}`;
            
            const elapsed = Date.now() - lastUpdateTime;
            const remaining = Math.max(0, (5000 - elapsed) / 1000).toFixed(1);
            
            // Spinner animation: - \ | /
            const frames = ['-', '\\', '|', '/'];
            const frameIndex = Math.floor(Date.now() / 150) % 4;
            const spinner = frames[frameIndex];
            
            document.getElementById('cycle-info').innerText = 
                `${spinner} Next update in: ${remaining}s | Source: Binance API | WebSocket: Active`;
            
            // Update progress bar
            const progress = Math.min((elapsed / 5000) * 100, 100);
            document.getElementById('progress').style.width = `${progress}%`;
        }

        async function fetchCoin(coin) {
            try {
                const r = await fetch(`/api/predict?coin=${coin}`);
                return await r.json();
            } catch (e) { return { success: false }; }
        }

        async function update() {
            const head = "┌───────────┬───────────────┬───────────┬────────────────┐\n";
            const mid  = "├───────────┼───────────────┼───────────┼────────────────┤\n";
            const end  = "└───────────┴───────────────┴───────────┴────────────────┘\n";
            
            let output = head;
            for (let i = 0; i < coins.length; i++) {
                const coin = coins[i];
                const data = await fetchCoin(coin);
                if (data.success) {
                    const price = data.price.toFixed(2).padStart(8);
                    const pred = data.trend.padEnd(4);
                    const change = (data.change >= 0 ? '+' : '') + data.change.toFixed(2) + '%';
                    
                    const c1 = " " + coin.padEnd(10);
                    const c2 = " Now: " + price + " ";
                    const c3 = " Pred: " + pred;
                    const c4 = " Change: " + change.padStart(6) + " ";
                    
                    output += `│${c1}│${c2}│${c3}│${c4}│\n`;
                } else {
                    output += `│ ${coin.padEnd(10)}│ Offline       │ ----      │ ----           │\n`;
                }
                output += (i === coins.length - 1) ? end : mid;
            }
            
            document.getElementById('dashboard').innerText = output;
            lastUpdateTime = Date.now();
        }

        setInterval(updateClock, 100);
        update();
        setInterval(update, 5000);
    </script>
</body>
</html>
